name: Unit tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -v
