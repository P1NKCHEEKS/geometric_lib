name: Unit tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout called repository
        uses: dariocurr/checkout-called@v4.1.7

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.16.0"

      - name: Run unit tests
        run: python -m unittest discover -v
